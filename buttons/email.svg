<svg xmlns="http://www.w3.org/2000/svg" width="172" height="48" viewBox="0 0 172 48">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#238636"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2ea043" flood-opacity="0.28"/>
    </filter>
    <clipPath id="clip">
      <rect width="172" height="48" rx="14"/>
    </clipPath>
  </defs>

  <!-- Shadow -->
  <g filter="url(#shadow)">
    <rect width="172" height="48" rx="14" fill="#2ea043" opacity="0.15"/>
  </g>

  <!-- Card -->
  <rect x="0.75" y="0.75" width="170.5" height="46.5" rx="13.5"
        fill="url(#bg)" stroke="url(#border)" stroke-width="1.5"/>

  <!-- Glass highlight -->
  <rect x="1" y="1" width="170" height="20" rx="13" fill="white" opacity="0.04" clip-path="url(#clip)"/>

  <!-- Email envelope icon -->
  <g transform="translate(14,13)">
    <rect width="22" height="22" rx="4" fill="none"/>
    <!-- Envelope body -->
    <rect x="1" y="4" width="20" height="14" rx="2" fill="#3fb950"/>
    <!-- Envelope flap -->
    <polyline points="1,4 11,13 21,4" fill="none" stroke="white" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Base line -->
    <line x1="1" y1="18" x2="21" y2="18" stroke="#238636" stroke-width="1"/>
  </g>

  <!-- Label -->
  <text x="103" y="29"
        text-anchor="middle"
        font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="13.5" font-weight="600" letter-spacing="0.3"
        fill="#f0f6fc">Email</text>

  <!-- Accent -->
  <line x1="155" y1="14" x2="155" y2="34" stroke="#3fb950" stroke-width="1" opacity="0.6"/>
  <circle cx="162" cy="24" r="3" fill="#3fb950" opacity="0.8"/>
</svg>
