<svg xmlns="http://www.w3.org/2000/svg" width="140" height="46" viewBox="0 0 140 46" font-family="'Inter', -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="emGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#00e676" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="emBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
    <style>
      @keyframes capellixPulseEm {
        0%, 100% { opacity: 0.4; fill: #34d399; }
        50% { opacity: 1; fill: #ffffff; filter: drop-shadow(0 0 4px #00ff88); }
      }
    </style>
  </defs>

  <!-- Glowing Shadow & Chassis -->
  <g filter="url(#emGlow)">
    <rect x="2" y="2" width="136" height="42" rx="12" fill="#070b09" stroke="url(#emBorder)" stroke-width="1.4"/>
  </g>

  <!-- Top Glass Highlight -->
  <path d="M 14 3 L 126 3 A 11 11 0 0 1 137 14 L 137 18 Q 70 12 3 18 L 3 14 A 11 11 0 0 1 14 3 Z" fill="#ffffff" opacity="0.04"/>

  <!-- Email Icon -->
  <g transform="translate(16, 14)">
    <rect x="1" y="3" width="16" height="12" rx="2" fill="none" stroke="#00e676" stroke-width="1.5" />
    <path d="M2 4.5 L9 10 L16 4.5" fill="none" stroke="#00e676" stroke-width="1.3" stroke-linecap="round" />
  </g>

  <!-- Button Label -->
  <text x="44" y="28" font-size="13" font-weight="600" fill="#f1f5f9" letter-spacing="0.3px">Email</text>

  <!-- Capellix Status LED -->
  <rect x="120" y="21" width="5" height="5" rx="1.5" fill="#34d399" style="animation: capellixPulseEm 2s ease-in-out infinite; animation-delay: 1.2s;"/>
</svg>
