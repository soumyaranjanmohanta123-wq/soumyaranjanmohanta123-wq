<svg xmlns="http://www.w3.org/2000/svg" width="140" height="46" viewBox="0 0 140 46" font-family="'Inter', -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="portGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#00ff88" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="portBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="50%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <style>
      @keyframes capellixPulsePort {
        0%, 100% { opacity: 0.4; fill: #00ff88; }
        50% { opacity: 1; fill: #ffffff; filter: drop-shadow(0 0 4px #00ff88); }
      }
    </style>
  </defs>

  <!-- Glowing Shadow & Chassis -->
  <g filter="url(#portGlow)">
    <rect x="2" y="2" width="136" height="42" rx="12" fill="#070b09" stroke="url(#portBorder)" stroke-width="1.4"/>
  </g>

  <!-- Top Glass Highlight -->
  <path d="M 14 3 L 126 3 A 11 11 0 0 1 137 14 L 137 18 Q 70 12 3 18 L 3 14 A 11 11 0 0 1 14 3 Z" fill="#ffffff" opacity="0.04"/>

  <!-- Globe / Portfolio Icon -->
  <g transform="translate(16, 14)">
    <circle cx="9" cy="9" r="8" fill="none" stroke="#00ff88" stroke-width="1.6" />
    <ellipse cx="9" cy="9" rx="3.5" ry="8" fill="none" stroke="#00ff88" stroke-width="1.2" />
    <line x1="1" y1="9" x2="17" y2="9" stroke="#00ff88" stroke-width="1.2" />
  </g>

  <!-- Button Label -->
  <text x="44" y="28" font-size="13" font-weight="600" fill="#f1f5f9" letter-spacing="0.3px">Portfolio</text>

  <!-- Capellix Status LED -->
  <rect x="120" y="21" width="5" height="5" rx="1.5" fill="#00ff88" style="animation: capellixPulsePort 2s ease-in-out infinite; animation-delay: 0.4s;"/>
</svg>
