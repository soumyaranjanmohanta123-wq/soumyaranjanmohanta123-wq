<svg xmlns="http://www.w3.org/2000/svg" width="160" height="44" viewBox="0 0 160 44">
  <defs>
    <linearGradient id="portGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fe428e" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>
  <rect width="160" height="44" rx="10" fill="#141321" />
  <rect x="1" y="1" width="158" height="42" rx="10" fill="none" stroke="url(#portGrad)" stroke-width="1.3" opacity="0.85" />
  
  <!-- Portfolio / Globe Icon -->
  <g transform="translate(18, 12)">
    <circle cx="10" cy="10" r="9" fill="none" stroke="#fe428e" stroke-width="1.8" />
    <ellipse cx="10" cy="10" rx="4" ry="9" fill="none" stroke="#fe428e" stroke-width="1.3" />
    <line x1="1" y1="10" x2="19" y2="10" stroke="#fe428e" stroke-width="1.3" />
  </g>

  <!-- Text -->
  <text x="48" y="27" font-family="'JetBrains Mono', 'Inter', monospace" font-size="13" font-weight="600" fill="#fe428e" letter-spacing="0.5px">Portfolio</text>
  <circle cx="140" cy="22" r="3" fill="#fe428e">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>
