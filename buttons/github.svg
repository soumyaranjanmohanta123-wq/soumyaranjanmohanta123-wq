<svg xmlns="http://www.w3.org/2000/svg" width="140" height="46" viewBox="0 0 140 46" font-family="'Inter', -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="ghGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#00e676" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="ghBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="50%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <style>
      @keyframes capellixPulseGh {
        0%, 100% { opacity: 0.4; fill: #00e676; }
        50% { opacity: 1; fill: #ffffff; filter: drop-shadow(0 0 4px #00ff88); }
      }
    </style>
  </defs>

  <!-- Glowing Shadow & Chassis -->
  <g filter="url(#ghGlow)">
    <rect x="2" y="2" width="136" height="42" rx="12" fill="#070b09" stroke="url(#ghBorder)" stroke-width="1.4"/>
  </g>

  <!-- Top Glass Highlight -->
  <path d="M 14 3 L 126 3 A 11 11 0 0 1 137 14 L 137 18 Q 70 12 3 18 L 3 14 A 11 11 0 0 1 14 3 Z" fill="#ffffff" opacity="0.04"/>

  <!-- GitHub Octocat Icon -->
  <g transform="translate(16, 13) scale(0.85)">
    <path fill="#00ff88" fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
  </g>

  <!-- Button Label -->
  <text x="44" y="28" font-size="13" font-weight="600" fill="#f1f5f9" letter-spacing="0.3px">GitHub</text>

  <!-- Capellix Status LED -->
  <rect x="120" y="21" width="5" height="5" rx="1.5" fill="#00ff88" style="animation: capellixPulseGh 2s ease-in-out infinite;"/>
</svg>
