<svg xmlns="http://www.w3.org/2000/svg" width="172" height="48" viewBox="0 0 172 48">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#1f6feb"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#388bfd" flood-opacity="0.3"/>
    </filter>
    <clipPath id="clip">
      <rect width="172" height="48" rx="14"/>
    </clipPath>
  </defs>

  <!-- Shadow layer -->
  <g filter="url(#shadow)">
    <rect width="172" height="48" rx="14" fill="#388bfd" opacity="0.15"/>
  </g>

  <!-- Border stroke -->
  <rect x="0.75" y="0.75" width="170.5" height="46.5" rx="13.5"
        fill="url(#bg)" stroke="url(#border)" stroke-width="1.5"/>

  <!-- Glass highlight -->
  <rect x="1" y="1" width="170" height="20" rx="13" fill="white" opacity="0.04" clip-path="url(#clip)"/>

  <!-- LinkedIn icon -->
  <g transform="translate(16,14) scale(0.83)">
    <rect width="24" height="24" rx="4" fill="#58a6ff"/>
    <path fill="white"
      d="M8 10H5.5v8H8v-8zm-1.25-3.5a1.5 1.5 0 100 3 1.5 1.5 0 000-3zM18.5 10c-1.7 0-2.8.9-3.25 1.75V10H12.75v8H15.5v-4.25c0-1.15.55-2 1.75-2s1.75.85 1.75 2V18H21.5v-4.75c0-2.5-1.5-3.25-3-3.25z"/>
  </g>

  <!-- Label -->
  <text x="103" y="29"
        text-anchor="middle"
        font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="13.5" font-weight="600" letter-spacing="0.3"
        fill="#f0f6fc">LinkedIn</text>

  <!-- Accent -->
  <line x1="155" y1="14" x2="155" y2="34" stroke="#388bfd" stroke-width="1" opacity="0.6"/>
  <circle cx="162" cy="24" r="3" fill="#58a6ff" opacity="0.8"/>
</svg>
