<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">
  <defs>

    <!-- Name gradient: indigo → violet → sky -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#818CF8"/>
      <stop offset="45%"  stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Divider gradient: fades out at edges -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#6366F1" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#818CF8" stop-opacity="1"/>
      <stop offset="70%"  stop-color="#38BDF8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle glow on name text -->
    <filter id="nameGlow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0.5 0 0 0 0.32
                0   0 0 0 0.24
                0   0 0 0 0.98
                0   0 0 0.6 0" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Dot accent glow -->
    <filter id="dotGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      /* ── Staggered entrance animations ── */
      .accent-dot {
        animation: dotPop 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.1s both;
      }
      .name-text {
        animation: riseIn 0.9s cubic-bezier(0.22,1,0.36,1) 0.25s both;
      }
      .divider-line {
        animation: expandLine 0.8s cubic-bezier(0.22,1,0.36,1) 0.9s both;
        transform-origin: 450px 140px;
      }
      .subtitle-text {
        animation: riseIn 0.8s cubic-bezier(0.22,1,0.36,1) 1.1s both;
      }
      .tagline-text {
        animation: riseIn 0.8s cubic-bezier(0.22,1,0.36,1) 1.35s both;
      }

      @keyframes riseIn {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: translateY(0);    }
      }
      @keyframes expandLine {
        from { transform: scaleX(0); opacity: 0; }
        to   { transform: scaleX(1); opacity: 1; }
      }
      @keyframes dotPop {
        from { transform: scale(0); opacity: 0; }
        to   { transform: scale(1); opacity: 1; }
      }
      /* Continuous subtle pulse on the two accent dots */
      @keyframes pulse {
        0%, 100% { opacity: 0.7; }
        50%       { opacity: 1;   }
      }
      .pulse { animation: pulse 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- ── Background: transparent ── -->
  <rect width="900" height="220" fill="none"/>

  <!-- ── Decorative accent dots (top corners) ── -->
  <circle class="accent-dot" cx="200" cy="50" r="4" fill="#818CF8" filter="url(#dotGlow)" style="animation-delay:0.05s"/>
  <circle class="accent-dot" cx="700" cy="50" r="4" fill="#38BDF8" filter="url(#dotGlow)" style="animation-delay:0.15s"/>
  <circle class="accent-dot pulse" cx="200" cy="50" r="4" fill="#818CF8" filter="url(#dotGlow)"/>
  <circle class="accent-dot pulse" cx="700" cy="50" r="4" fill="#38BDF8" filter="url(#dotGlow)"/>

  <!-- ── Main Name ── -->
  <text class="name-text"
        x="450" y="115"
        text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="58"
        font-weight="700"
        letter-spacing="4"
        fill="url(#nameGrad)"
        filter="url(#nameGlow)">
    SOUMYA RANJAN MOHANTA
  </text>

  <!-- ── Thin gradient divider ── -->
  <line class="divider-line"
        x1="220" y1="135" x2="680" y2="135"
        stroke="url(#lineGrad)" stroke-width="1.5"/>

  <!-- ── Subtitle ── -->
  <text class="subtitle-text"
        x="450" y="167"
        text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="15"
        font-weight="400"
        letter-spacing="5"
        fill="#94A3B8">
    FULL-STACK ENGINEER
  </text>

  <!-- ── Tagline ── -->
  <text class="tagline-text"
        x="450" y="193"
        text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="12"
        font-weight="300"
        letter-spacing="3"
        fill="#475569">
    Open Source  ·  Cloud Native  ·  TypeScript  ·  Python  ·  Rust
  </text>

</svg>
