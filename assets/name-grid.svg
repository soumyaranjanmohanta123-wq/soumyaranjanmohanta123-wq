<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 185" width="860" height="185">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141321" />
      <stop offset="50%" stop-color="#1a182c" />
      <stop offset="100%" stop-color="#141321" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fe428e">
        <animate attributeName="stop-color" values="#fe428e;#a855f7;#a9fef7;#fe428e" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#a9fef7;#fe428e;#a855f7" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#a9fef7">
        <animate attributeName="stop-color" values="#a9fef7;#fe428e;#a855f7;#a9fef7" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <filter id="neonGlowPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="neonGlowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @keyframes pulseSlow {
        0%, 100% { opacity: 0.95; }
        50% { opacity: 0.55; }
      }
      @keyframes pulseCyan {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px #a9fef7); }
        50% { opacity: 0.6; filter: drop-shadow(0 0 1px #a9fef7); }
      }
      @keyframes pulsePink {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px #fe428e); }
        50% { opacity: 0.6; filter: drop-shadow(0 0 1px #fe428e); }
      }
      @keyframes radarWave {
        0% { r: 3.5px; opacity: 0.9; }
        100% { r: 12px; opacity: 0; }
      }
      .bg-rect { fill: url(#cardGrad); }
      .border-rect { fill: none; stroke: url(#borderGrad); stroke-width: 1.6; }
      
      .c-empty { fill: #201e33; }
      .c-dim   { fill: #48234a; }
      .c-mid   { fill: #8a1f64; }
      .c-pink  { fill: #fe428e; animation: pulsePink 3.5s ease-in-out infinite; }
      .c-cyan  { fill: #a9fef7; animation: pulseCyan 4s ease-in-out infinite; }
      
      .sub-title {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 2.5px;
        fill: #a9fef7;
      }
      .sub-role {
        font-family: 'Inter', -apple-system, sans-serif;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 1.5px;
        fill: #9493b8;
      }
      .beacon-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 1px;
        fill: #a9fef7;
      }
    </style>
  </defs>

  <!-- Background with Glowing Border -->
  <rect width="860" height="185" rx="14" class="bg-rect" />
  <rect x="1" y="1" width="858" height="183" rx="14" class="border-rect" />

  <!-- Top bar dots -->
  <g transform="translate(24, 20)">
