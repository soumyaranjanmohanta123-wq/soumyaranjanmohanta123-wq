<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 320" width="580" height="320">
  <defs>
    <linearGradient id="dominarCodeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b09" />
      <stop offset="50%" stop-color="#0c1510" />
      <stop offset="100%" stop-color="#070b09" />
    </linearGradient>
    <linearGradient id="dominarCodeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e676">
        <animate attributeName="stop-color" values="#00e676;#00ff88;#10b981;#00e676" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00ff88">
        <animate attributeName="stop-color" values="#00ff88;#10b981;#00e676;#00ff88" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <style>
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .kw   { fill: #00e676; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; font-weight: 600; }
      .pl   { fill: #00ff88; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; }
      .str  { fill: #a7f3d0; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; }
      .op   { fill: #10b981; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; }
      .cm   { fill: #52796f; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12.5px; font-style: italic; }
      .val  { fill: #6ee7b7; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; }
      .wh   { fill: #e2e8f0; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; }
      .cursor {
        fill: #00ff88;
        animation: blinkCursor 0.85s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Frame -->
  <rect width="580" height="320" rx="12" fill="url(#dominarCodeBg)" />
  <rect x="1" y="1" width="578" height="318" rx="12" fill="none" stroke="url(#dominarCodeBorder)" stroke-width="1.5" />

  <!-- Title bar -->
  <rect x="1" y="1" width="578" height="38" rx="12" fill="#0d1812" />
  <rect x="1" y="28" width="578" height="11" fill="#0d1812" />
  <line x1="1" y1="39" x2="579" y2="39" stroke="#162e21" stroke-width="1" />

  <!-- Cockpit Headlamp LED Controls -->
  <circle cx="20" cy="20" r="5.5" fill="#00e676" />
  <circle cx="38" cy="20" r="5.5" fill="#00ff88" />
  <circle cx="56" cy="20" r="5.5" fill="#10b981" />

  <!-- Tab badge -->
  <rect x="200" y="8" width="180" height="23" rx="5" fill="#070b09" stroke="#1b3d2b" stroke-width="1" />
  <text x="214" y="24" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#00e676" font-weight="bold">DOMINAR // DOHC</text>
  <text x="330" y="24" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#a7f3d0">soumya.ts</text>

  <!-- Pulsing Engine RPM Indicator -->
  <g transform="translate(545, 20)">
    <circle cx="0" cy="0" r="4" fill="#00ff88" />
    <circle cx="0" cy="0" r="7" fill="none" stroke="#00ff88" stroke-width="1.3">
      <animate attributeName="r" values="3.5;10" dur="1.6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0" dur="1.6s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Code content -->
  <!-- Line 1 -->
  <text x="24" y="70"><tspan class="kw">const</tspan><tspan class="wh"> soumya</tspan><tspan class="op">:</tspan><tspan class="pl"> HyperTourer</tspan><tspan class="wh"> = {</tspan></text>
  
  <!-- Line 2 -->
  <text x="24" y="94"><tspan class="wh">  </tspan><tspan class="pl">rider</tspan><tspan class="op">:</tspan><tspan class="wh"> </tspan><tspan class="str">"Soumya Ranjan Mohanta"</tspan><tspan class="wh">,</tspan></text>
  
  <!-- Line 3 -->
  <text x="24" y="118"><tspan class="wh">  </tspan><tspan class="pl">machine</tspan><tspan class="op">:</tspan><tspan class="wh"> </tspan><tspan class="str">"Dominar 400 // Aurora Green Edition"</tspan><tspan class="wh">,</tspan></text>
  
  <!-- Line 4 -->
  <text x="24" y="142"><tspan class="wh">  </tspan><tspan class="pl">role</tspan><tspan class="op">:</tspan><tspan class="wh"> </tspan><tspan class="str">"Full-Stack &amp; High-Torque Architect"</tspan><tspan class="wh">,</tspan></text>
  
  <!-- Line 5 -->
  <text x="24" y="166"><tspan class="wh">  </tspan><tspan class="pl">powerOutput</tspan><tspan class="op">:</tspan><tspan class="wh"> </tspan><tspan class="str">"Peak Torque • 100% High-Performance 🏍️"</tspan><tspan class="wh">,</tspan></text>
  
  <!-- Line 6 -->
  <text x="24" y="190"><tspan class="wh">  </tspan><tspan class="pl">arsenal</tspan><tspan class="op">:</tspan><tspan class="wh"> [</tspan><tspan class="str">"TypeScript"</tspan><tspan class="wh">, </tspan><tspan class="str">"Next.js"</tspan><tspan class="wh">, </tspan><tspan class="str">"Python"</tspan><tspan class="wh">, </tspan><tspan class="str">"Rust"</tspan><tspan class="wh">],</tspan></text>
  
  <!-- Line 7 -->
  <text x="24" y="214"><tspan class="wh">  </tspan><tspan class="pl">touringRange</tspan><tspan class="op">:</tspan><tspan class="wh"> [</tspan><tspan class="str">"Cloud Microservices"</tspan><tspan class="wh">, </tspan><tspan class="str">"AI Engines"</tspan><tspan class="wh">],</tspan></text>
  
  <!-- Line 8 -->
  <text x="24" y="238"><tspan class="wh">  </tspan><tspan class="pl">hireable</tspan><tspan class="op">:</tspan><tspan class="wh"> </tspan><tspan class="val">true</tspan><tspan class="wh">,  </tspan><tspan class="cm">// Ready for long sprints</tspan></text>
  
  <!-- Line 9 -->
  <text x="24" y="262"><tspan class="wh">  </tspan><tspan class="pl">hyperSprint</tspan><tspan class="op">:</tspan><tspan class="wh"> </tspan><tspan class="val">true</tspan></text>
  
  <!-- Line 10 -->
  <text x="24" y="286"><tspan class="wh">};</tspan><rect x="42" y="274" width="8" height="15" rx="1" class="cursor" /></text>
  
  <!-- Footer Note -->
  <text x="24" y="306" class="cm">// 🟢 Born to Sprint, Built to Tour • Shipping robust software</text>
</svg>
