<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 320" width="580" height="320">
  <defs>
    <linearGradient id="cardGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141321" />
      <stop offset="100%" stop-color="#181729" />
    </linearGradient>
    <linearGradient id="codeBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fe428e">
        <animate attributeName="stop-color" values="#fe428e;#a9fef7;#a855f7;#fe428e" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#a9fef7">
        <animate attributeName="stop-color" values="#a9fef7;#fe428e;#a855f7;#a9fef7" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <style>
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes livePulse {
        0% { r: 3.5px; opacity: 1; }
        100% { r: 10px; opacity: 0; }
      }
      .kw   { fill: #fe428e; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; font-weight: 600; }
      .pl   { fill: #a9fef7; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; }
      .str  { fill: #f8d847; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; }
      .op   { fill: #f43f5e; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; }
      .cm   { fill: #6e6a86; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12.5px; font-style: italic; }
      .val  { fill: #c084fc; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; }
      .num  { fill: #38bdf8; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; }
      .wh   { fill: #e2e8f0; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; }
      .cursor {
        fill: #fe428e;
        animation: blinkCursor 0.9s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Window Frame -->
  <rect width="580" height="320" rx="12" fill="url(#cardGradDark)" />
  <rect x="1" y="1" width="578" height="318" rx="12" fill="none" stroke="url(#codeBorderGrad)" stroke-width="1.4" />

  <!-- Title bar -->
  <rect x="1" y="1" width="578" height="38" rx="12" fill="#1b1a2c" />
  <rect x="1" y="28" width="578" height="11" fill="#1b1a2c" />
  <line x1="1" y1="39" x2="579" y2="39" stroke="#2a2742" stroke-width="1" />

  <!-- macOS dots -->
  <circle cx="20" cy="20" r="5.5" fill="#fe428e" />
  <circle cx="38" cy="20" r="5.5" fill="#f8d847" />
  <circle cx="56" cy="20" r="5.5" fill="#22c55e" />

  <!-- Tab badge -->
  <rect x="235" y="8" width="110" height="23" rx="5" fill="#141321" stroke="#2d2b45" stroke-width="1" />
  <text x="250" y="24" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#3178c6" font-weight="bold">TS</text>
  <text x="272" y="24" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#a9fef7">soumya.ts</text>

  <!-- Live beacon inside window -->
  <g transform="translate(545, 20)">
    <circle cx="0" cy="0" r="4" fill="#22c55e" />
    <circle cx="0" cy="0" r="7" fill="none" stroke="#22c55e" stroke-width="1.2">
      <animate attributeName="r" values="3.5;10" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0" dur="1.8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Code content -->
  <!-- Line 1 -->
  <text x="24" y="70"><tspan class="kw">const</tspan><tspan class="wh"> soumya</tspan><tspan class="op">:</tspan><tspan class="pl"> Developer</tspan><tspan class="wh"> = {</tspan></text>
  
  <!-- Line 2 -->
  <text x="24" y="94"><tspan class="wh">  </tspan><tspan class="pl">name</tspan><tspan class="op">:</tspan><tspan class="wh"> </tspan><tspan class="str">"Soumya Ranjan Mohanta"</tspan><tspan class="wh">,</tspan></text>
  
  <!-- Line 3 -->
  <text x="24" y="118"><tspan class="wh">  </tspan><tspan class="pl">role</tspan><tspan class="op">:</tspan><tspan class="wh"> </tspan><tspan class="str">"Full-Stack &amp; AI Engineer"</tspan><tspan class="wh">,</tspan></text>
  
  <!-- Line 4 -->
  <text x="24" y="142"><tspan class="wh">  </tspan><tspan class="pl">location</tspan><tspan class="op">:</tspan><tspan class="wh"> </tspan><tspan class="str">"Bhubaneswar, India 🇮🇳"</tspan><tspan class="wh">,</tspan></text>
  
  <!-- Line 5 -->
  <text x="24" y="166"><tspan class="wh">  </tspan><tspan class="pl">codeFocus</tspan><tspan class="op">:</tspan><tspan class="wh"> [</tspan><tspan class="str">"Distributed Systems"</tspan><tspan class="wh">, </tspan><tspan class="str">"Next-Gen AI"</tspan><tspan class="wh">],</tspan></text>
  
  <!-- Line 6 -->
  <text x="24" y="190"><tspan class="wh">  </tspan><tspan class="pl">techStack</tspan><tspan class="op">:</tspan><tspan class="wh"> [</tspan><tspan class="str">"TypeScript"</tspan><tspan class="wh">, </tspan><tspan class="str">"React/Next"</tspan><tspan class="wh">, </tspan><tspan class="str">"Python"</tspan><tspan class="wh">, </tspan><tspan class="str">"Rust"</tspan><tspan class="wh">],</tspan></text>
  
  <!-- Line 7 -->
  <text x="24" y="214"><tspan class="wh">  </tspan><tspan class="pl">learning</tspan><tspan class="op">:</tspan><tspan class="wh"> </tspan><tspan class="str">"AI Agents &amp; GPU Computing"</tspan><tspan class="wh">,</tspan></text>
  
  <!-- Line 8 -->
  <text x="24" y="238"><tspan class="wh">  </tspan><tspan class="pl">hireable</tspan><tspan class="op">:</tspan><tspan class="wh"> </tspan><tspan class="val">true</tspan><tspan class="wh">,  </tspan><tspan class="cm">// Open for collaborations &amp; roles</tspan></text>
  
  <!-- Line 9 -->
  <text x="24" y="262"><tspan class="wh">  </tspan><tspan class="pl">coffeeDriven</tspan><tspan class="op">:</tspan><tspan class="wh"> </tspan><tspan class="val">true</tspan></text>
  
  <!-- Line 10 -->
  <text x="24" y="286"><tspan class="wh">};</tspan><rect x="42" y="274" width="8" height="15" rx="1" class="cursor" /></text>
  
  <!-- Footer Note -->
  <text x="24" y="306" class="cm">// 🚀 Passionate about crafting high-impact software experiences</text>
</svg>
