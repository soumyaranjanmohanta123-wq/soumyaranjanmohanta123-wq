<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 320" width="580" height="320">
  <defs>
    <linearGradient id="raOneCodeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080c" />
      <stop offset="50%" stop-color="#110912" />
      <stop offset="100%" stop-color="#08080c" />
    </linearGradient>
    <linearGradient id="raOneCodeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0044">
        <animate attributeName="stop-color" values="#ff0044;#00f0ff;#ff3d00;#ff0044" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00f0ff">
        <animate attributeName="stop-color" values="#00f0ff;#ff0044;#ff1744;#00f0ff" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <style>
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .kw   { fill: #ff0044; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; font-weight: 600; }
      .pl   { fill: #00f0ff; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; }
      .str  { fill: #ff9100; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; }
      .op   { fill: #ff1744; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; }
      .cm   { fill: #64748b; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12.5px; font-style: italic; }
      .val  { fill: #00e5ff; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; }
      .wh   { fill: #e2e8f0; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; }
      .cursor {
        fill: #ff0044;
        animation: blinkCursor 0.85s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Frame -->
  <rect width="580" height="320" rx="12" fill="url(#raOneCodeBg)" />
  <rect x="1" y="1" width="578" height="318" rx="12" fill="none" stroke="url(#raOneCodeBorder)" stroke-width="1.5" />

  <!-- Title bar -->
  <rect x="1" y="1" width="578" height="38" rx="12" fill="#140d16" />
  <rect x="1" y="28" width="578" height="11" fill="#140d16" />
  <line x1="1" y1="39" x2="579" y2="39" stroke="#2b1420" stroke-width="1" />

  <!-- Glowing controls -->
  <circle cx="20" cy="20" r="5.5" fill="#ff0044" />
  <circle cx="38" cy="20" r="5.5" fill="#ff9100" />
  <circle cx="56" cy="20" r="5.5" fill="#00f0ff" />

  <!-- Tab badge -->
  <rect x="210" y="8" width="160" height="23" rx="5" fill="#08080c" stroke="#331422" stroke-width="1" />
  <text x="224" y="24" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#ff0044" font-weight="bold">H.A.R.T.</text>
  <text x="282" y="24" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#00f0ff">soumya.ts</text>

  <!-- Pulsing H.A.R.T. Reactor Core -->
  <g transform="translate(545, 20)">
    <circle cx="0" cy="0" r="4" fill="#ff0044" />
    <circle cx="0" cy="0" r="7" fill="none" stroke="#ff0044" stroke-width="1.3">
      <animate attributeName="r" values="3.5;10" dur="1.6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0" dur="1.6s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Code content -->
  <!-- Line 1 -->
  <text x="24" y="70"><tspan class="kw">const</tspan><tspan class="wh"> soumya</tspan><tspan class="op">:</tspan><tspan class="pl"> CyberEntity</tspan><tspan class="wh"> = {</tspan></text>
  
  <!-- Line 2 -->
  <text x="24" y="94"><tspan class="wh">  </tspan><tspan class="pl">identity</tspan><tspan class="op">:</tspan><tspan class="wh"> </tspan><tspan class="str">"Soumya Ranjan Mohanta"</tspan><tspan class="wh">,</tspan></text>
  
  <!-- Line 3 -->
  <text x="24" y="118"><tspan class="wh">  </tspan><tspan class="pl">protocol</tspan><tspan class="op">:</tspan><tspan class="wh"> </tspan><tspan class="str">"Random Access v1.0 // Ra.One"</tspan><tspan class="wh">,</tspan></text>
  
  <!-- Line 4 -->
  <text x="24" y="142"><tspan class="wh">  </tspan><tspan class="pl">role</tspan><tspan class="op">:</tspan><tspan class="wh"> </tspan><tspan class="str">"Full-Stack &amp; AI Architect"</tspan><tspan class="wh">,</tspan></text>
  
  <!-- Line 5 -->
  <text x="24" y="166"><tspan class="wh">  </tspan><tspan class="pl">hartCore</tspan><tspan class="op">:</tspan><tspan class="wh"> </tspan><tspan class="str">"Online • 100% Charged 🔥"</tspan><tspan class="wh">,</tspan></text>
  
  <!-- Line 6 -->
  <text x="24" y="190"><tspan class="wh">  </tspan><tspan class="pl">powers</tspan><tspan class="op">:</tspan><tspan class="wh"> [</tspan><tspan class="str">"TypeScript"</tspan><tspan class="wh">, </tspan><tspan class="str">"Next.js"</tspan><tspan class="wh">, </tspan><tspan class="str">"Python"</tspan><tspan class="wh">, </tspan><tspan class="str">"Rust"</tspan><tspan class="wh">],</tspan></text>
  
  <!-- Line 7 -->
  <text x="24" y="214"><tspan class="wh">  </tspan><tspan class="pl">specialty</tspan><tspan class="op">:</tspan><tspan class="wh"> [</tspan><tspan class="str">"High-Scale Web"</tspan><tspan class="wh">, </tspan><tspan class="str">"AI Engines"</tspan><tspan class="wh">],</tspan></text>
  
  <!-- Line 8 -->
  <text x="24" y="238"><tspan class="wh">  </tspan><tspan class="pl">hireable</tspan><tspan class="op">:</tspan><tspan class="wh"> </tspan><tspan class="val">true</tspan><tspan class="wh">,  </tspan><tspan class="cm">// Ready for impact</tspan></text>
  
  <!-- Line 9 -->
  <text x="24" y="262"><tspan class="wh">  </tspan><tspan class="pl">supercharged</tspan><tspan class="op">:</tspan><tspan class="wh"> </tspan><tspan class="val">true</tspan></text>
  
  <!-- Line 10 -->
  <text x="24" y="286"><tspan class="wh">};</tspan><rect x="42" y="274" width="8" height="15" rx="1" class="cursor" /></text>
  
  <!-- Footer Note -->
  <text x="24" y="306" class="cm">// ⚡ Materializing clean code out of digital pixels</text>
</svg>
