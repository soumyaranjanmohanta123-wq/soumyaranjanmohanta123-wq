<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 320" width="580" height="320">
  <defs>
    <linearGradient id="ramCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060907" />
      <stop offset="50%" stop-color="#0c1611" />
      <stop offset="100%" stop-color="#060907" />
    </linearGradient>
    <linearGradient id="ramBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e676">
        <animate attributeName="stop-color" values="#00e676;#00ff88;#10b981;#00e676" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00ff88">
        <animate attributeName="stop-color" values="#00ff88;#10b981;#00e676;#00ff88" dur="5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <style>
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes ramCapellix {
        0%, 100% { opacity: 0.3; fill: #00e676; }
        50% { opacity: 1; fill: #ffffff; filter: drop-shadow(0 0 6px #00ff88); }
      }
      .kw   { fill: #00e676; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; font-weight: 600; }
      .pl   { fill: #00ff88; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; }
      .str  { fill: #a7f3d0; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; }
      .op   { fill: #10b981; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; }
      .cm   { fill: #52796f; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12.5px; font-style: italic; }
      .val  { fill: #6ee7b7; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; }
      .wh   { fill: #e2e8f0; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; }
      .cursor {
        fill: #00ff88;
        animation: blinkCursor 0.85s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Frame -->
  <rect width="580" height="320" rx="12" fill="url(#ramCardBg)" />
  <rect x="1" y="1" width="578" height="318" rx="12" fill="none" stroke="url(#ramBorder)" stroke-width="1.5" />

  <!-- Title bar -->
  <rect x="1" y="1" width="578" height="38" rx="12" fill="#0d1812" />
  <rect x="1" y="28" width="578" height="11" fill="#0d1812" />
  <line x1="1" y1="39" x2="579" y2="39" stroke="#162e21" stroke-width="1" />

  <!-- Dominator RAM Capellix Top LEDs -->
  <g transform="translate(16, 15)">
    <rect x="0"  y="0" width="10" height="9" rx="2" fill="#00ff88" style="animation: ramCapellix 1.8s ease-in-out infinite; animation-delay: 0.0s;" />
    <rect x="14" y="0" width="10" height="9" rx="2" fill="#00ff88" style="animation: ramCapellix 1.8s ease-in-out infinite; animation-delay: 0.3s;" />
    <rect x="28" y="0" width="10" height="9" rx="2" fill="#00ff88" style="animation: ramCapellix 1.8s ease-in-out infinite; animation-delay: 0.6s;" />
    <rect x="42" y="0" width="10" height="9" rx="2" fill="#00ff88" style="animation: ramCapellix 1.8s ease-in-out infinite; animation-delay: 0.9s;" />
  </g>

  <!-- Tab badge -->
  <rect x="180" y="8" width="220" height="23" rx="5" fill="#060907" stroke="#1b3d2b" stroke-width="1" />
  <text x="195" y="24" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#00e676" font-weight="bold">DOMINATOR // DDR5</text>
  <text x="340" y="24" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#a7f3d0">soumya.ts</text>

  <!-- iCUE Status Beacon -->
  <g transform="translate(545, 20)">
    <circle cx="0" cy="0" r="4" fill="#00ff88" />
    <circle cx="0" cy="0" r="7" fill="none" stroke="#00ff88" stroke-width="1.3">
      <animate attributeName="r" values="3.5;10" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0" dur="1.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Code content -->
  <!-- Line 1 -->
  <text x="24" y="70"><tspan class="kw">const</tspan><tspan class="wh"> soumya</tspan><tspan class="op">:</tspan><tspan class="pl"> DominatorModule</tspan><tspan class="wh"> = {</tspan></text>
  
  <!-- Line 2 -->
  <text x="24" y="94"><tspan class="wh">  </tspan><tspan class="pl">name</tspan><tspan class="op">:</tspan><tspan class="wh"> </tspan><tspan class="str">"Soumya Ranjan Mohanta"</tspan><tspan class="wh">,</tspan></text>
  
  <!-- Line 3 -->
  <text x="24" y="118"><tspan class="wh">  </tspan><tspan class="pl">hardware</tspan><tspan class="op">:</tspan><tspan class="wh"> </tspan><tspan class="str">"DOMINATOR TITANIUM // DDR5 7200MHz"</tspan><tspan class="wh">,</tspan></text>
  
  <!-- Line 4 -->
  <text x="24" y="142"><tspan class="wh">  </tspan><tspan class="pl">role</tspan><tspan class="op">:</tspan><tspan class="wh"> </tspan><tspan class="str">"Full-Stack Performance Architect"</tspan><tspan class="wh">,</tspan></text>
  
  <!-- Line 5 -->
  <text x="24" y="166"><tspan class="wh">  </tspan><tspan class="pl">latency</tspan><tspan class="op">:</tspan><tspan class="wh"> </tspan><tspan class="str">"CL30 Ultra-Low • Zero Bottlenecks ⚡"</tspan><tspan class="wh">,</tspan></text>
  
  <!-- Line 6 -->
  <text x="24" y="190"><tspan class="wh">  </tspan><tspan class="pl">powers</tspan><tspan class="op">:</tspan><tspan class="wh"> [</tspan><tspan class="str">"TypeScript"</tspan><tspan class="wh">, </tspan><tspan class="str">"Next.js"</tspan><tspan class="wh">, </tspan><tspan class="str">"Python"</tspan><tspan class="wh">, </tspan><tspan class="str">"Rust"</tspan><tspan class="wh">],</tspan></text>
  
  <!-- Line 7 -->
  <text x="24" y="214"><tspan class="wh">  </tspan><tspan class="pl">rgbProfile</tspan><tspan class="op">:</tspan><tspan class="wh"> </tspan><tspan class="str">"Capellix Emerald Wave // 60 FPS"</tspan><tspan class="wh">,</tspan></text>
  
  <!-- Line 8 -->
  <text x="24" y="238"><tspan class="wh">  </tspan><tspan class="pl">hireable</tspan><tspan class="op">:</tspan><tspan class="wh"> </tspan><tspan class="val">true</tspan><tspan class="wh">,  </tspan><tspan class="cm">// High-throughput production ready</tspan></text>
  
  <!-- Line 9 -->
  <text x="24" y="262"><tspan class="wh">  </tspan><tspan class="pl">overclocked</tspan><tspan class="op">:</tspan><tspan class="wh"> </tspan><tspan class="val">true</tspan></text>
  
  <!-- Line 10 -->
  <text x="24" y="286"><tspan class="wh">};</tspan><rect x="42" y="274" width="8" height="15" rx="1" class="cursor" /></text>
  
  <!-- Footer Note -->
  <text x="24" y="306" class="cm">// 🟢 Corsair Dominator Capellix RGB • Pure high-frequency code</text>
</svg>
