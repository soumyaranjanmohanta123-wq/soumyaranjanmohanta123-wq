name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"   # runs every 12 hours
  workflow_dispatch:            # allows manual trigger

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: soumyaranjanmohanta123-wq
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2300CC44&color_dots[]=ebedf0,9be9a8,40c463,30a14e,216e39&color_empty=ebedf0
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2339d353&color_dots[]=161b22,0e4429,006d32,26a641,39d353&color_empty=161b22

      - name: Push output to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
